<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browser performance baseline</title>
    <style>
      #results {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 2;
        display: none;
      }
    </style>
  </head>
  <body>
    <pre id="results">Running browser baseline...</pre>
    <script type="module">
      import { createComparisonSections } from '../src/comparison/comparisonModel.js';
      import {
        serializeSectionForCopy,
        serializeSectionsForExport,
        serializeSectionsForJsonExport,
      } from '../src/clipboard/serializeSection.js';
      import { getVisibleSectionForCopy } from '../src/clipboard/visibleSection.js';
      import { parseInput } from '../src/parsers/index.js';
      import { createExactMatchTargets } from '../src/search/exactMatch.js';
      import { filterSectionsByQuery } from '../src/search/filterSections.js';
      import {
        activateCoreAnalyticsFacet,
        getCoreAnalyticsFacetOptions,
        getCoreAnalyticsInvestigation,
        getCoreAnalyticsView,
      } from '../src/ui/coreAnalyticsView.js';
      import { renderSections } from '../src/ui/renderApp.js';
      import { renderSectionNav } from '../src/ui/renderSectionNav.js';
      import { createLargeCoreAnalyticsFixture, createLargeStackshotFixture } from './fixtures/largeReportWorkloads.js';

      const resultsElement = document.querySelector('#results');
      const errors = [];
      const settleMode = document.visibilityState === 'hidden' ? 'setTimeout(0) hidden-document fallback' : 'requestAnimationFrame';
      window.addEventListener('error', (event) => errors.push(event.message));
      window.addEventListener('unhandledrejection', (event) => errors.push(String(event.reason)));

      function nextFrame() {
        const timeoutFallback = new Promise((resolve) => setTimeout(resolve, 50));
        if (document.visibilityState === 'hidden') {
          return new Promise((resolve) => setTimeout(resolve, 0));
        }
        return Promise.race([
          new Promise((resolve) => requestAnimationFrame(resolve)),
          timeoutFallback,
        ]);
      }

      function summarizeSamples(samples) {
        const sorted = [...samples].sort((left, right) => left - right);
        return {
          cycles: samples.length,
          minMs: sorted[0],
          medianMs: sorted[Math.floor(sorted.length / 2)],
          p95Ms: sorted[Math.max(0, Math.ceil(sorted.length * 0.95) - 1)],
          maxMs: sorted.at(-1),
        };
      }

      async function measureAsync(operation, iterations = 10) {
        for (let index = 0; index < 3; index += 1) {
          operation();
          await nextFrame();
        }

        const samples = [];
        for (let index = 0; index < iterations; index += 1) {
          const started = performance.now();
          operation();
          await nextFrame();
          samples.push(performance.now() - started);
        }
        return summarizeSamples(samples);
      }

      function renderParsedSections(sections, {
        allSections = sections,
        searchActive = false,
        matchRegions = [],
        activeExactMatchId = '',
        presentation = 'report',
        reportIdentity = null,
        onExitMode = null,
        coreAnalyticsView = null,
        coreAnalyticsFacetOptions = null,
        coreAnalyticsInvestigation = null,
        selectedCoreAnalyticsFacetKey = '',
        selectedCoreAnalyticsFacetQuery = '',
        onSelectCoreAnalyticsFacet = null,
        onClearCoreAnalyticsSearch = null,
      } = {}) {
        const sectionRoot = document.querySelector('#sections');
        const navRoot = document.querySelector('#section-nav');
        const resolvedCoreAnalyticsView = coreAnalyticsView ?? getCoreAnalyticsView(allSections);
        const resolvedFacetOptions = presentation === 'report' && resolvedCoreAnalyticsView.isCoreAnalytics
          ? coreAnalyticsFacetOptions ?? getCoreAnalyticsFacetOptions(resolvedCoreAnalyticsView)
          : coreAnalyticsFacetOptions;
        renderSectionNav(navRoot, sections);
        renderSections(sectionRoot, sections, {
          allSections,
          coreAnalyticsView: resolvedCoreAnalyticsView,
          coreAnalyticsFacetOptions: resolvedFacetOptions,
          coreAnalyticsInvestigation,
          selectedCoreAnalyticsFacetKey,
          selectedCoreAnalyticsFacetQuery,
          onSelectCoreAnalyticsFacet: onSelectCoreAnalyticsFacet ?? (resolvedFacetOptions ? () => {} : null),
          onClearCoreAnalyticsSearch: onClearCoreAnalyticsSearch ?? (coreAnalyticsInvestigation ? () => {} : null),
          searchActive,
          matchRegions,
          activeExactMatchId,
          presentation,
          reportIdentity: reportIdentity ?? {
            title: 'Parsed report',
            type: 'Browser harness report',
            mode: 'Sanitized view',
            description: 'Synthetic browser harness content.',
          },
          onExitMode,
          onCopySection: () => Promise.resolve({ ok: true }),
        });
      }

      function clearRenderedState() {
        document.querySelector('#sections').replaceChildren();
        document.querySelector('#section-nav').replaceChildren();
      }

      function renderCoreAnalyticsInvestigation(sections) {
        const view = getCoreAnalyticsView(sections);
        const facetOptions = getCoreAnalyticsFacetOptions(view);
        const group = facetOptions.find(({ options }) => options.length > 0);
        const option = group?.options[0];
        if (!option) return null;

        const state = activateCoreAnalyticsFacet(group.key, option);
        const searchResult = filterSectionsByQuery(sections, option.query);
        const investigation = getCoreAnalyticsInvestigation(view, searchResult, state);
        renderParsedSections(searchResult.sections, {
          allSections: sections,
          coreAnalyticsView: view,
          coreAnalyticsFacetOptions: facetOptions,
          coreAnalyticsInvestigation: investigation,
          selectedCoreAnalyticsFacetKey: state.selectedFacetKey,
          selectedCoreAnalyticsFacetQuery: state.selectedFacetQuery,
          onSelectCoreAnalyticsFacet: () => {},
          onClearCoreAnalyticsSearch: () => {},
          searchActive: true,
          matchRegions: searchResult.matchRegions,
        });

        const renderedRows = view.tables.eventTypes.rows.length + view.tables.sampleRecords.rows.length;
        const matchingRows = searchResult.sections
          .filter((section) => ['coreanalytics-event-types', 'coreanalytics-sample-records'].includes(section.id))
          .reduce((total, section) => total + section.table.length, 0);
        const contextCount = document.querySelectorAll('#sections .coreanalytics-overview__investigation').length;
        const resetControlCount = document.querySelectorAll('#sections .coreanalytics-overview__investigation .clear-search').length;
        if (renderedRows > 200 || matchingRows > renderedRows) errors.push('CoreAnalytics investigation exceeded rendered-row bounds');
        if (investigation.mode !== 'active' || contextCount !== 1 || resetControlCount !== 1) {
          errors.push('CoreAnalytics investigation render did not remain a single active context and reset control');
        }

        return {
          renderedRows,
          matchingRows,
          contextCount,
          resetControlCount,
          tableCaps: [view.tables.eventTypes.rows.length, view.tables.sampleRecords.rows.length],
        };
      }

      function accessibilityReport() {
        const controls = [...document.querySelectorAll('button, input, textarea, a')];
        const unavailableControls = controls.filter((control) =>
          control.closest('details:not([open]), dialog:not([open]), [hidden]')
        );
        const unnamed = controls
          .filter((control) => {
            const label = control.getAttribute('aria-label') || control.getAttribute('aria-labelledby');
            const associatedLabel = control.id && document.querySelector(`label[for="${control.id}"]`);
            const wrappingLabel = control.closest('label');
            return !label && !associatedLabel && !wrappingLabel && !control.textContent.trim() && !control.getAttribute('title');
          })
          .map((control) => control.id || control.tagName.toLowerCase());
        const focusFailures = controls
          .filter((control) => !unavailableControls.includes(control) && !control.disabled && control.getClientRects().length > 0)
          .filter((control) => {
            control.focus();
            return document.activeElement !== control;
          })
          .map((control) => control.id || control.tagName.toLowerCase());
        const hiddenFocusLeaks = unavailableControls
          .filter((control) => !control.disabled)
          .filter((control) => {
            control.focus();
            return document.activeElement === control;
          })
          .map((control) => control.id || control.tagName.toLowerCase());

        return {
          controlCount: controls.length,
          unnamedControls: unnamed,
          focusFailures,
          hiddenFocusLeaks,
          exportControls: ['download-visible-export', 'download-visible-json'].map((id) => ({
            id,
            present: Boolean(document.querySelector(`#${id}`)),
          })),
        };
      }

      function containmentReport() {
        return {
          viewportWidth: window.innerWidth,
          documentScrollWidth: document.documentElement.scrollWidth,
          bodyScrollWidth: document.body.scrollWidth,
          sectionScrollWidth: document.querySelector('#sections').scrollWidth,
          pageOverflow: document.documentElement.scrollWidth > window.innerWidth,
          tableScrollRegionCount: document.querySelectorAll('#sections .table-scroll[role="region"][tabindex="0"]').length,
        };
      }

      function reportDocumentSemantics() {
        const reportDocument = document.querySelector('#sections.report-document');
        const tables = [...document.querySelectorAll('#sections table')];
        return {
          continuousDocument: Boolean(reportDocument),
          reportHeader: reportDocument?.querySelector(':scope > .report-document__header h2')?.textContent ?? '',
          sectionHeadingLevels: [...document.querySelectorAll('#sections > article [data-section-heading]')]
            .map((heading) => heading.tagName),
          definitionRowCount: document.querySelectorAll('#sections .field-list > .field-row').length,
          tableCount: tables.length,
          labelledTableCount: tables.filter((table) => table.hasAttribute('aria-labelledby')).length,
          rowHeaderCount: document.querySelectorAll('#sections tbody th[scope="row"]').length,
          namedScrollRegionCount: document.querySelectorAll('#sections .table-scroll[role="region"][aria-labelledby][aria-describedby]').length,
          chartEquivalentCount: document.querySelectorAll('#sections .chart-data').length,
        };
      }

      async function loadAppMarkup() {
        const source = await fetch('../index.html').then((response) => response.text());
        const template = new DOMParser().parseFromString(source, 'text/html');
        template.body.querySelectorAll('script').forEach((script) => script.remove());
        const resultPlaceholder = resultsElement;
        document.body.replaceChildren(...template.body.childNodes, resultPlaceholder);
        const stylesheet = document.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.href = '../styles/main.css';
        document.head.append(stylesheet);
        const reportContentStylesheet = document.createElement('link');
        reportContentStylesheet.rel = 'stylesheet';
        reportContentStylesheet.href = '../styles/report-content.css';
        document.head.append(reportContentStylesheet);
      }

      async function benchmarkReport(text, query, parserType) {
        let sections;
        const coldStarted = performance.now();
        sections = parseInput(text);
        renderParsedSections(sections);
        await nextFrame();
        const coldParseToRenderMs = performance.now() - coldStarted;

        const parseOnly = await measureAsync(() => {
          sections = parseInput(text);
        });
        const renderOnly = await measureAsync(() => {
          renderParsedSections(sections);
        });
        const parseToRender = await measureAsync(() => {
          sections = parseInput(text);
          renderParsedSections(sections);
        });

        const search = await measureAsync(() => {
          const filtered = filterSectionsByQuery(sections, query);
          const targets = createExactMatchTargets(filtered.matchRegions);
          renderParsedSections(filtered.sections, {
            allSections: sections,
            searchActive: true,
            matchRegions: filtered.matchRegions,
            activeExactMatchId: targets[0]?.id ?? '',
          });
        });

        const noResultsSearch = await measureAsync(() => {
          const filtered = filterSectionsByQuery(sections, 'NO-SUCH-SYNTHETIC-TERM');
          renderParsedSections(filtered.sections, {
            allSections: sections,
            searchActive: true,
            matchRegions: filtered.matchRegions,
          });
        });

        const clearSearch = await measureAsync(() => renderParsedSections(sections));
        const investigation = parserType === 'coreanalytics'
          ? {
              render: await measureAsync(() => renderCoreAnalyticsInvestigation(sections)),
              output: renderCoreAnalyticsInvestigation(sections),
            }
          : null;
        const comparisonEntry = {
          classification: { parserType, supported: true },
          sections,
        };
        const comparisonEntries = [comparisonEntry, comparisonEntry, comparisonEntry];
        let comparisonSections;
        const comparison = await measureAsync(() => {
          comparisonSections = createComparisonSections(comparisonEntries);
          const filtered = filterSectionsByQuery(comparisonSections, query);
          const targets = createExactMatchTargets(filtered.matchRegions);
          renderParsedSections(filtered.sections, {
            allSections: comparisonSections,
            searchActive: true,
            matchRegions: filtered.matchRegions,
            activeExactMatchId: targets[0]?.id ?? '',
            presentation: 'comparison',
            reportIdentity: {
              title: 'Multi-Report Comparison',
              type: `${parserType} · 3 reports`,
              mode: 'Comparison · sanitized only',
              description: 'Synthetic browser harness comparison.',
              reportCount: 3,
              parserType,
            },
          });
        });
        const clearComparison = await measureAsync(() => {
          clearRenderedState();
          renderParsedSections(sections);
        });
        const clearReport = await measureAsync(() => clearRenderedState());

        return {
          coldParseToRenderMs,
          parseOnly,
          renderOnly,
          parseToRender,
          search,
          noResultsSearch,
          clearSearch,
          investigation,
          comparison,
          clearComparison,
          clearReport,
          sectionCount: sections.length,
          renderedRows: sections.reduce((total, section) => total + (section.table?.length ?? 0), 0),
        };
      }

      async function repeatedWorkflow(text, query, cycles = 20) {
        const samples = [];
        for (let index = 0; index < cycles; index += 1) {
          const started = performance.now();
          const sections = parseInput(text);
          renderParsedSections(sections);
          await nextFrame();
          const filtered = filterSectionsByQuery(sections, query);
          const targets = createExactMatchTargets(filtered.matchRegions);
          renderParsedSections(filtered.sections, {
            allSections: sections,
            searchActive: true,
            matchRegions: filtered.matchRegions,
            activeExactMatchId: targets[0]?.id ?? '',
          });
          await nextFrame();
          renderParsedSections(sections);
          await nextFrame();
          const entry = { classification: { parserType: 'coreanalytics', supported: true }, sections };
          const comparisonSections = createComparisonSections([entry, entry]);
          const comparisonFiltered = filterSectionsByQuery(comparisonSections, query);
          const comparisonTargets = createExactMatchTargets(comparisonFiltered.matchRegions);
          renderParsedSections(comparisonFiltered.sections, {
            allSections: comparisonSections,
            searchActive: true,
            matchRegions: comparisonFiltered.matchRegions,
            activeExactMatchId: comparisonTargets[0]?.id ?? '',
            presentation: 'comparison',
            reportIdentity: {
              title: 'Multi-Report Comparison',
              type: 'coreanalytics · 2 reports',
              mode: 'Comparison · sanitized only',
              description: 'Synthetic repeated comparison.',
              reportCount: 2,
              parserType: 'coreanalytics',
            },
          });
          await nextFrame();
          clearRenderedState();
          await nextFrame();
          samples.push(performance.now() - started);
        }
        await nextFrame();
        return summarizeSamples(samples);
      }

      async function exactMatchRenderingWorkflow() {
        const sections = [{
          id: 'exact-match-harness',
          title: 'Needle title',
          priority: 'normal',
          fields: [{ label: 'Needle label', value: 'Needle value 😀' }],
          tableColumns: [{ key: 'value', label: 'Needle header' }],
          table: [{ value: 'Needle cell' }],
          chart: {
            type: 'memory',
            title: 'Needle chart',
            items: [{ label: 'Needle chart label', value: 17, color: '#30d158' }],
          },
          raw: 'Needle text',
        }];
        const filtered = filterSectionsByQuery(sections, 'needle');
        const targets = createExactMatchTargets(filtered.matchRegions);
        renderParsedSections(filtered.sections, {
          allSections: sections,
          searchActive: true,
          matchRegions: filtered.matchRegions,
          activeExactMatchId: targets[0]?.id ?? '',
        });
        await nextFrame();

        const marks = [...document.querySelectorAll('#sections mark.exact-match')];
        const activeMarks = marks.filter((mark) => mark.classList.contains('exact-match--active'));
        const kinds = [...new Set(marks.map((mark) => mark.dataset.exactMatchKind))].sort();
        const targetIds = marks.map((mark) => mark.dataset.exactMatchId);
        const chartValueFiltered = filterSectionsByQuery(sections, '17');
        const chartValueTargets = createExactMatchTargets(chartValueFiltered.matchRegions);
        renderParsedSections(chartValueFiltered.sections, {
          allSections: sections,
          searchActive: true,
          matchRegions: chartValueFiltered.matchRegions,
          activeExactMatchId: chartValueTargets[0]?.id ?? '',
        });
        await nextFrame();
        const hostileSection = [{
          ...sections[0],
          id: 'hostile-exact-match-harness',
          title: '<img src=x onerror=alert(1)> Needle',
        }];
        const hostileFiltered = filterSectionsByQuery(hostileSection, 'needle');
        renderParsedSections(hostileFiltered.sections, {
          allSections: hostileSection,
          searchActive: true,
          matchRegions: hostileFiltered.matchRegions,
          activeExactMatchId: createExactMatchTargets(hostileFiltered.matchRegions)[0]?.id ?? '',
        });
        await nextFrame();

        return {
          targetCount: targets.length,
          renderedMarkCount: marks.length,
          activeMarkCount: activeMarks.length,
          renderedKinds: kinds,
          targetIdsUnique: new Set(targetIds).size === targetIds.length,
          chartValueTargetCount: chartValueTargets.filter((target) => target.kind === 'chart-value').length,
          chartValueCanvasCount: document.querySelectorAll('#sections canvas').length,
          chartDataRowCount: document.querySelectorAll('#sections .chart-data__row').length,
          hostileImageCount: document.querySelectorAll('#sections img').length,
          hostileTextPreserved: document.querySelector('#sections [data-section-heading]')?.textContent.includes('<img src=x onerror=alert(1)>') === true,
        };
      }

      async function modePresentationSafetyWorkflow() {
        const hostileRaw = '<script>window.rawEscape=true<\/script>\n<img src="/raw-escape.png" onerror="window.rawEscape=true">\n<a href="https://example.invalid">literal link</a>';
        const rawSections = [{
          id: 'raw-hostile-content',
          title: 'Raw hostile content',
          priority: 'info',
          fields: [],
          raw: hostileRaw,
        }];
        renderParsedSections(rawSections, {
          presentation: 'raw',
          reportIdentity: {
            title: 'Raw Local View — not uploaded',
            type: 'Synthetic report',
            mode: 'Raw Local View',
            description: 'Synthetic literal-content safety check.',
          },
        });
        await nextFrame();

        const rawRegion = document.querySelector('#sections .raw-local-view__content');
        const rawAttributeSurface = [...document.querySelectorAll('#sections *')]
          .filter((element) => element !== rawRegion)
          .flatMap((element) => [...element.attributes].map((attribute) => attribute.value))
          .join(' ');
        const raw = {
          modeTitle: document.querySelector('#report-document-title')?.textContent ?? '',
          literalTextPreserved: rawRegion?.textContent === hostileRaw,
          keyboardScrollRegion: rawRegion?.matches('pre[role="region"][tabindex="0"][aria-labelledby]') === true,
          scriptElementCount: document.querySelectorAll('#sections script').length,
          imageElementCount: document.querySelectorAll('#sections img').length,
          linkElementCount: document.querySelectorAll('#sections a').length,
          hostileTextInAttributes: rawAttributeSurface.includes(hostileRaw),
          executionSentinel: globalThis.rawEscape === true,
        };

        const localAlias = 'setup-only-alias-sentinel';
        const firstEntry = {
          classification: { parserType: 'ips', supported: true },
          localLabel: localAlias,
          sections: [{
            id: 'summary',
            title: 'Summary',
            fields: [
              { label: 'OS Version', value: 'iOS 18.4' },
              { label: 'Reason', value: '<img src=/comparison-escape.png>' },
              { label: 'Device', value: 'iPhone' },
            ],
          }],
        };
        const secondEntry = {
          classification: { parserType: 'ips', supported: true },
          localLabel: localAlias,
          sections: [{
            id: 'summary',
            title: 'Summary',
            fields: [
              { label: 'OS Version', value: 'iOS 18.5' },
              { label: 'Device', value: 'iPhone' },
            ],
          }],
        };
        const comparisonSections = createComparisonSections([firstEntry, secondEntry]);
        renderParsedSections(comparisonSections, {
          presentation: 'comparison',
          reportIdentity: {
            title: 'Multi-Report Comparison',
            type: 'ips · 2 reports',
            mode: 'Comparison · sanitized only',
            description: 'Only generated sanitized comparison values are included.',
            reportCount: 2,
            parserType: 'ips',
          },
        });
        await nextFrame();

        const comparisonSurface = document.querySelector('#sections');
        const comparisonAttributes = [...comparisonSurface.querySelectorAll('*')]
          .flatMap((element) => [...element.attributes].map((attribute) => attribute.value))
          .join(' ');
        const comparison = {
          continuousDocument: comparisonSurface.classList.contains('report-document--comparison'),
          genericIdentityCount: comparisonSurface.querySelectorAll('.comparison-identity').length,
          localAliasInText: comparisonSurface.textContent.includes(localAlias),
          localAliasInAttributes: comparisonAttributes.includes(localAlias),
          rowHeaderTexts: [...comparisonSurface.querySelectorAll('#comparison-differences tbody th[scope="row"]')]
            .map((cell) => cell.textContent),
          missingValueVisible: comparisonSurface.textContent.includes('Not present'),
          hostileImageCount: comparisonSurface.querySelectorAll('img').length,
          hostileValueLiteral: comparisonSurface.textContent.includes('<img src=/comparison-escape.png>'),
          namedTableRegions: comparisonSurface.querySelectorAll('.table-scroll[role="region"][tabindex="0"][aria-labelledby]').length,
        };

        return { raw, comparison };
      }

      function visibleSearchContractWorkflow() {
        const hiddenValue = ['hidden', 'workflow', 'value'].join('-');
        const sections = [{
          id: 'visible-search-contract',
          title: 'Workflow table',
          priority: 'normal',
          tableColumns: [{ key: 'visible', label: 'Visible value' }],
          table: [{ visible: 'Visible workflow cell repeat repeat', helper: hiddenValue }],
        }];
        const transitions = [
          ['empty', ''],
          ['visible-cell', 'visible workflow cell'],
          ['hidden-only', hiddenValue],
          ['no-result', 'no such workflow value'],
          ['repeated-occurrence', 'repeat'],
          ['cleared', ''],
        ].map(([state, query]) => {
          const filtered = filterSectionsByQuery(sections, query);
          const targets = createExactMatchTargets(filtered.matchRegions);
          renderParsedSections(filtered.sections, {
            allSections: sections,
            searchActive: filtered.active,
            matchRegions: filtered.matchRegions,
            activeExactMatchId: targets[0]?.id ?? '',
          });
          const visibleSections = filtered.sections.map((section) =>
            getVisibleSectionForCopy(section, { allSections: sections })
          );
          const copy = visibleSections.map(serializeSectionForCopy).join('\n');
          const textExport = serializeSectionsForExport(visibleSections);
          const jsonExport = serializeSectionsForJsonExport(visibleSections);
          const renderedRoots = [document.querySelector('#sections'), document.querySelector('#section-nav')];
          const renderedSurface = renderedRoots.flatMap((root) => [
            root.textContent,
            ...[...root.querySelectorAll('*')].flatMap((element) => [...element.attributes].map((attribute) => attribute.value)),
          ]).join(' ');

          return {
            state,
            active: filtered.active,
            sectionCount: filtered.sections.length,
            rowCount: filtered.sections.flatMap((section) => section.table ?? []).length,
            matchCount: filtered.totalMatches,
            navigationCount: filtered.navigationTargets.length,
            targetCount: targets.length,
            renderedNavigationCount: document.querySelectorAll('#section-nav a').length,
            renderedMarkCount: document.querySelectorAll('#sections mark.exact-match').length,
            copyEligible: Boolean(copy),
            textExportEligible: Boolean(textExport),
            jsonSectionCount: JSON.parse(jsonExport).sections.length,
            hiddenValueExposed: `${renderedSurface}\n${copy}\n${textExport}\n${jsonExport}`.includes(hiddenValue),
          };
        });

        return { transitions };
      }

      async function applicationWorkflow(coreText) {
        await import('../src/main.js');
        const visibleQuery = 'demo.';
        const pasteInput = document.querySelector('#paste-input');
        const searchInput = document.querySelector('#result-search');
        const setSearch = async (query) => {
          searchInput.value = query;
          searchInput.dispatchEvent(new Event('input', { bubbles: true }));
          await new Promise((resolve) => setTimeout(resolve, 220));
          await nextFrame();
        };
        const state = () => ({
          searchValue: searchInput.value,
          resultStatus: document.querySelector('#status').textContent,
          searchStatus: document.querySelector('#search-count').textContent,
          exactStatus: document.querySelector('#exact-match-status').textContent,
          exactPosition: document.querySelector('#exact-match-position').textContent,
          exactPreviousDisabled: document.querySelector('#exact-match-previous').disabled,
          exactNextDisabled: document.querySelector('#exact-match-next').disabled,
          sectionCount: document.querySelectorAll('#sections > article').length,
          sectionNavigationCount: document.querySelectorAll('#section-nav a').length,
          searchNavigationHidden: document.querySelector('#search-navigation').hidden,
          exactNavigationHidden: document.querySelector('#exact-match-navigation').hidden,
          renderedMarkCount: document.querySelectorAll('#sections mark.exact-match').length,
          textExportDisabled: document.querySelector('#download-visible-export').disabled,
          jsonExportDisabled: document.querySelector('#download-visible-json').disabled,
          reportActionsHidden: document.querySelector('#report-actions').hidden,
          reportActionsExpanded: document.querySelector('#report-actions-trigger').getAttribute('aria-expanded'),
          reportActionsContentHidden: document.querySelector('#export-panel').hidden,
          desktopNavigationHidden: document.querySelector('#section-nav').hidden,
          sectionsTriggerHidden: document.querySelector('#sections-trigger').hidden,
          sectionDialogOpen: document.querySelector('#section-dialog').open,
          duplicateIdCount: [...document.querySelectorAll('[id]')]
            .filter((element, index, elements) => elements.findIndex((candidate) => candidate.id === element.id) !== index)
            .length,
          reportPresentation: document.querySelector('#sections')?.classList.contains('report-document') === true,
          comparisonPresentation: document.querySelector('#sections')?.classList.contains('report-document--comparison') === true,
          rawPresentation: document.querySelector('#sections')?.classList.contains('report-document--raw') === true,
          reportHeader: document.querySelector('#report-document-title')?.textContent ?? '',
          modeAction: document.querySelector('#sections .report-document__mode-action')?.textContent ?? '',
          comparisonIdentityCount: document.querySelectorAll('#sections .comparison-identity').length,
          comparisonSetupHidden: document.querySelector('#comparison-panel').hidden,
          searchLabel: document.querySelector('#result-search')?.labels?.[0]?.textContent.trim() ?? '',
          rawScrollRegionCount: document.querySelectorAll('#sections .raw-local-view__content[role="region"][tabindex="0"]').length,
          visibleH1Text: [...document.querySelectorAll('h1')]
            .find((heading) => heading.getClientRects().length > 0)?.textContent.trim() ?? '',
          reportHeadingLevel: document.querySelector('#report-document-title')?.tagName ?? '',
          viewport: { width: window.innerWidth, height: window.innerHeight },
          pageOverflow: document.documentElement.scrollWidth > window.innerWidth,
        });

        pasteInput.value = coreText;
        document.querySelector('#parse-paste').click();
        await nextFrame();
        const workspaceFocusMoved = document.activeElement === document.querySelector('#workspace-heading');
        document.querySelector('#sections .coreanalytics-overview__chip')?.click();
        await new Promise((resolve) => setTimeout(resolve, 220));
        const selectedFacetQuery = searchInput.value;
        const selectedFacetContextVisible = document.querySelector('.coreanalytics-overview__investigation') !== null;
        document.querySelector('#privacy-toggle').click();
        await nextFrame();
        const rawFacetTransition = state();
        const rawFacetContextCount = document.querySelectorAll('.coreanalytics-overview__investigation').length;
        const privacyFacetTransition = {
          selectedFacetQuery,
          selectedFacetContextVisible,
          rawSearchValue: rawFacetTransition.searchValue,
          rawContextCount: rawFacetContextCount,
        };
        if (!selectedFacetQuery || !selectedFacetContextVisible || rawFacetTransition.searchValue !== '' || rawFacetContextCount !== 0) {
          errors.push('privacy transition bridged an active sanitized facet query or context into Raw Local View');
        }
        document.querySelector('#sections .report-document__mode-action')?.click();
        await nextFrame();
        const sanitizedFacetReturn = state();
        privacyFacetTransition.sanitizedReturnSearchValue = sanitizedFacetReturn.searchValue;
        privacyFacetTransition.sanitizedReturnContextCount = document.querySelectorAll('.coreanalytics-overview__investigation').length;
        if (sanitizedFacetReturn.searchValue !== '' || privacyFacetTransition.sanitizedReturnContextCount !== 0) {
          errors.push('privacy return restored stale facet query or context');
        }
        document.querySelector('#sections .coreanalytics-overview__chip')?.click();
        await new Promise((resolve) => setTimeout(resolve, 220));
        const facetClearSearch = {
          selectedFacetQuery: searchInput.value,
          selectedContextCount: document.querySelectorAll('.coreanalytics-overview__investigation').length,
        };
        document.querySelector('#clear-search').click();
        await nextFrame();
        const clearedFacetSearch = state();
        facetClearSearch.clearedSearchValue = clearedFacetSearch.searchValue;
        facetClearSearch.clearedContextCount = document.querySelectorAll('.coreanalytics-overview__investigation').length;
        if (!facetClearSearch.selectedFacetQuery || facetClearSearch.selectedContextCount !== 1
          || facetClearSearch.clearedSearchValue !== '' || facetClearSearch.clearedContextCount !== 0) {
          errors.push('Clear Search did not reset an active facet query and investigation context');
        }
        const reportActionsTrigger = document.querySelector('#report-actions-trigger');
        const reportActions = { availableAtViewport: !reportActionsTrigger.hidden };
        if (!reportActionsTrigger.hidden) {
          reportActionsTrigger.focus();
          reportActionsTrigger.click();
          await nextFrame();
          reportActions.open = reportActionsTrigger.getAttribute('aria-expanded') === 'true'
            && !document.querySelector('#export-panel').hidden;
          reportActions.entryFocus = document.activeElement?.closest('#export-panel') === document.querySelector('#export-panel');

          document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
          await nextFrame();
          reportActions.escapeClosed = reportActionsTrigger.getAttribute('aria-expanded') === 'false'
            && document.querySelector('#export-panel').hidden;
          reportActions.focusReturned = document.activeElement === reportActionsTrigger;

          reportActionsTrigger.click();
          document.body.dispatchEvent(new Event('pointerdown', { bubbles: true }));
          await nextFrame();
          reportActions.outsideClosed = reportActionsTrigger.getAttribute('aria-expanded') === 'false'
            && document.querySelector('#export-panel').hidden;
        }
        const sectionsTrigger = document.querySelector('#sections-trigger');
        const sectionDialog = document.querySelector('#section-dialog');
        const mobileNavigation = { availableAtViewport: !sectionsTrigger.hidden };
        if (!sectionsTrigger.hidden) {
          sectionsTrigger.focus();
          sectionsTrigger.click();
          await nextFrame();
          mobileNavigation.open = sectionDialog.open;
          mobileNavigation.modal = sectionDialog.matches(':modal');
          mobileNavigation.entryFocus = document.activeElement?.closest('#mobile-section-nav') === document.querySelector('#mobile-section-nav');

          document.querySelector('#section-dialog-close').click();
          await nextFrame();
          mobileNavigation.explicitClose = !sectionDialog.open;
          mobileNavigation.focusReturned = document.activeElement === sectionsTrigger;

          sectionsTrigger.click();
          await nextFrame();
          document.querySelector('#mobile-section-nav .section-nav__link').click();
          await nextFrame();
          mobileNavigation.selectionClosed = !sectionDialog.open;
          mobileNavigation.selectionFocusedSection = document.activeElement?.closest('#sections > article') !== null;
          mobileNavigation.currentStateCount = document.querySelectorAll('.section-nav__link[aria-current="location"]').length;

          sectionsTrigger.click();
          document.querySelector('#parse-paste').click();
          await nextFrame();
          mobileNavigation.replacementClosed = !sectionDialog.open;
        }
        await setSearch(visibleQuery);
        const visibleSearch = state();
        const exactNext = document.querySelector('#exact-match-next');
        exactNext.focus();
        exactNext.click();
        await nextFrame();
        const nextFocusRetained = document.activeElement === exactNext;

        const clearSearch = document.querySelector('#clear-search');
        clearSearch.focus();
        clearSearch.click();
        await nextFrame();
        const clearedSearch = state();
        const clearFocusReturned = document.activeElement === searchInput;

        await setSearch(visibleQuery);
        document.querySelector('#privacy-toggle').click();
        await nextFrame();
        const rawLocalView = state();
        const rawReturn = document.querySelector('#sections .report-document__mode-action');
        rawReturn.focus();
        rawReturn.click();
        await nextFrame();
        const sanitizedReturn = state();
        const rawReturnFocus = document.activeElement === document.querySelector('#privacy-toggle');
        const rawContentRemoved = !document.querySelector('#sections').classList.contains('report-document--raw');

        document.querySelector('#parse-paste').click();
        await nextFrame();
        const reportTransition = state();

        document.querySelector('#sections .coreanalytics-overview__chip')?.click();
        await new Promise((resolve) => setTimeout(resolve, 220));
        const comparisonFacetTransition = {
          selectedFacetQuery: searchInput.value,
          selectedContextCount: document.querySelectorAll('.coreanalytics-overview__investigation').length,
        };
        document.querySelector('#add-to-comparison').click();
        await nextFrame();
        const localAlias = ['local', 'workflow', 'alias'].join('-');
        const localLabelInput = document.querySelector('#comparison-local-label-1');
        localLabelInput.value = localAlias;
        localLabelInput.dispatchEvent(new Event('input', { bubbles: true }));
        document.querySelector('#add-to-comparison').click();
        await nextFrame();
        document.querySelector('#compare-reports').click();
        await nextFrame();
        const comparisonModeState = state();
        comparisonFacetTransition.comparisonSearchValue = comparisonModeState.searchValue;
        comparisonFacetTransition.comparisonContextCount = document.querySelectorAll('.coreanalytics-overview__investigation').length;
        if (!comparisonFacetTransition.selectedFacetQuery || comparisonFacetTransition.selectedContextCount !== 1
          || comparisonFacetTransition.comparisonSearchValue !== '' || comparisonFacetTransition.comparisonContextCount !== 0) {
          errors.push('comparison entry retained an active facet query or investigation context');
        }
        const comparisonEntryFocus = document.activeElement === document.querySelector('#report-document-title');
        await setSearch(localAlias);
        const comparisonAliasSearch = state();
        const aliasInResults = document.querySelector('#sections').textContent.includes(localAlias);
        await setSearch('Report 1');
        const comparisonVisibleSearch = state();
        const comparisonExit = document.querySelector('#sections .report-document__mode-action');
        comparisonExit.focus();
        comparisonExit.click();
        await nextFrame();
        const comparisonExited = state();
        const comparisonExitFocus = document.activeElement === searchInput;
        document.querySelector('#clear-comparison').click();
        await nextFrame();
        const comparisonCleared = state();

        if (!document.querySelector('#sections-trigger').hidden) document.querySelector('#sections-trigger').click();
        document.querySelector('#clear-report').click();
        await nextFrame();
        const reportCleared = state();
        const clearReturnedToImport = document.activeElement === document.querySelector('#file-input');

        return {
          workspaceFocusMoved,
          reportActions,
          mobileNavigation,
          privacyFacetTransition,
          facetClearSearch,
          visibleSearch,
          nextFocusRetained,
          clearedSearch,
          clearFocusReturned,
          rawLocalView,
          sanitizedReturn,
          rawReturnFocus,
          rawContentRemoved,
          reportTransition,
          comparisonFacetTransition,
          comparisonModeState,
          comparisonEntryFocus,
          comparisonAliasSearch,
          aliasInResults,
          comparisonVisibleSearch,
          comparisonExited,
          comparisonExitFocus,
          comparisonCleared,
          reportCleared,
          clearReturnedToImport,
        };
      }

      async function responsiveBrowserWorkflow() {
        const frame = document.createElement('iframe');
        frame.title = 'Responsive CoreAnalytics test viewport';
        frame.width = '320';
        frame.height = '844';
        frame.style.cssText = 'position:fixed;left:-2000px;top:0;border:0';
        const loaded = new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
        frame.src = new URL('../index.html', window.location.href);
        document.body.append(frame);
        await loaded;

        const childWindow = frame.contentWindow;
        const childDocument = frame.contentDocument;
        const longFacetValue = `SyntheticLongFacet-${'x'.repeat(180)}`;
        childDocument.querySelector('#import-options').open = true;
        childDocument.querySelector('#paste-input').value = [
          JSON.stringify({ bug_type: '211' }),
          JSON.stringify({
            message: longFacetValue,
            name: 'SyntheticLongFacetEvent',
            aggregationPeriod: 'daily',
            numDaysAggregated: 1,
            sampling: '1',
          }),
          JSON.stringify({
            message: 'SyntheticResponsivePeer',
            name: 'SyntheticResponsivePeerEvent',
            aggregationPeriod: 'weekly',
            numDaysAggregated: 2,
            sampling: '2',
          }),
        ].join('\n');
        childDocument.querySelector('#parse-paste').click();
        const facet = childDocument.querySelector('#sections .coreanalytics-overview__chip');
        if (!facet) {
          errors.push('responsive iframe did not render the synthetic CoreAnalytics facet');
          frame.remove();
          return { viewports: [], largeText: null };
        }
        facet.click();
        await new Promise((resolve) => childWindow.setTimeout(resolve, 220));

        const viewports = [];
        for (const width of [320, 390, 768, 1280]) {
          frame.style.width = `${width}px`;
          await new Promise((resolve) => childWindow.setTimeout(resolve, 25));
          const viewport = childWindow.innerWidth;
          const pageOverflow = Math.max(childDocument.documentElement.scrollWidth, childDocument.body.scrollWidth) > viewport;
          const facetQuery = childDocument.querySelector('input[type="search"]')?.value ?? '';
          const rowScrollRegions = childDocument.querySelectorAll('#sections .table-scroll[role="region"][tabindex="0"]').length;
          const contextCount = childDocument.querySelectorAll('.coreanalytics-overview__investigation').length;
          const sectionsTriggerVisible = !childDocument.querySelector('#sections-trigger').hidden;
          viewports.push({ width, viewport, pageOverflow, facetQueryLength: facetQuery.length, rowScrollRegions, contextCount, sectionsTriggerVisible });

          if (viewport !== width || pageOverflow || facetQuery !== longFacetValue || rowScrollRegions === 0 || contextCount !== 1) {
            errors.push(`responsive CoreAnalytics workflow failed at ${width}px`);
          }
          if (width < 1024 && !sectionsTriggerVisible) errors.push(`mobile section navigation is hidden at ${width}px`);
          if (width >= 1024 && sectionsTriggerVisible) errors.push(`desktop section navigation trigger is shown at ${width}px`);
        }

        frame.style.width = '320px';
        await new Promise((resolve) => childWindow.setTimeout(resolve, 25));
        const trigger = childDocument.querySelector('#sections-trigger');
        const dialog = childDocument.querySelector('#section-dialog');
        trigger.focus();
        trigger.click();
        await new Promise((resolve) => childWindow.setTimeout(resolve, 25));
        const mobileDialog = {
          open: dialog.open,
          modal: dialog.matches(':modal'),
          focusEntered: childDocument.querySelector('#mobile-section-nav').contains(childDocument.activeElement),
        };
        childDocument.querySelector('#section-dialog-close').click();
        await new Promise((resolve) => childWindow.setTimeout(resolve, 25));
        mobileDialog.focusReturned = childDocument.activeElement === trigger;
        if (!mobileDialog.open || !mobileDialog.modal || !mobileDialog.focusEntered || !mobileDialog.focusReturned) {
          errors.push('320px section-dialog keyboard focus workflow failed');
        }

        const rootFontSize = childDocument.documentElement.style.fontSize;
        const largeText = [];
        for (const width of [320, 390]) {
          frame.style.width = `${width}px`;
          await new Promise((resolve) => childWindow.setTimeout(resolve, 25));
          childDocument.documentElement.style.fontSize = '200%';
          await new Promise((resolve) => childWindow.setTimeout(resolve, 25));
          const pageOverflow = Math.max(childDocument.documentElement.scrollWidth, childDocument.body.scrollWidth) > childWindow.innerWidth;
          const viewportResult = {
            viewport: childWindow.innerWidth,
            documentScrollWidth: childDocument.documentElement.scrollWidth,
            bodyScrollWidth: childDocument.body.scrollWidth,
            pageOverflow,
          };
          if (pageOverflow) {
            viewportResult.overflowNodes = [...childDocument.body.querySelectorAll('*')]
              .map((element) => ({ element, rect: element.getBoundingClientRect() }))
              .filter(({ element, rect }) => rect.width > 0 && rect.right > childWindow.innerWidth + 1)
              .slice(0, 12)
              .map(({ element, rect }) => ({
                tag: element.tagName.toLowerCase(),
                id: element.id,
                className: typeof element.className === 'string' ? element.className : '',
                left: Math.round(rect.left),
                right: Math.round(rect.right),
              }));
          }
          largeText.push(viewportResult);
          if (pageOverflow) errors.push(`${width}px large-text simulation caused page overflow`);
          childDocument.documentElement.style.fontSize = rootFontSize;
        }

        frame.remove();
        return { viewports, mobileDialog, largeText };
      }

      async function batteryPresentationWorkflow() {
        const batteryText = [
          JSON.stringify({ bug_type: '211' }),
          JSON.stringify({ name: 'launchCount', message: 'synthetic', aggregationPeriod: 'daily', numDaysAggregated: 1, sampling: '100' }),
          JSON.stringify({
            name: 'BatteryConfigValueHistogramFinal_V2',
            message: {
              last_value_CycleCount: 7,
              last_value_MaximumFCC: 4011,
              last_value_NominalChargeCapacity: 3922,
              last_value_AppleRawMaxCapacity: 3987,
              last_value_MaximumCapacityPercent: 88,
              last_value_MaximumQmax: 4200,
              last_value_QmaxCell0: 4200,
            },
            aggregationPeriod: 'Daily',
            numDaysAggregated: 1,
            sampling: 100,
          }),
        ].join('\n');
        const partialBatteryText = [
          JSON.stringify({ bug_type: '211' }),
          JSON.stringify({ name: 'launchCount', message: 'synthetic', aggregationPeriod: 'daily', numDaysAggregated: 1, sampling: '100' }),
          JSON.stringify({
            name: 'BatteryConfigValueHistogramFinal_V2',
            message: { last_value_MaximumCapacityPercent: 0 },
            aggregationPeriod: 'Daily',
            numDaysAggregated: 1,
            sampling: 100,
          }),
        ].join('\n');
        const pasteInput = document.querySelector('#paste-input');
        const searchInput = document.querySelector('#result-search');
        const parse = async (text) => {
          pasteInput.value = text;
          document.querySelector('#parse-paste').click();
          await nextFrame();
        };
        const snapshot = () => {
          const section = document.querySelector('#sections > #battery-and-charging');
          const duplicateIdCount = [...document.querySelectorAll('[id]')]
            .filter((element, index, elements) => elements.findIndex((candidate) => candidate.id === element.id) !== index)
            .length;
          return {
            present: Boolean(section),
            heading: section?.querySelector('[data-section-heading]')?.textContent ?? '',
            fields: [...(section?.querySelectorAll('.field-row') ?? [])].map((row) => ({
              label: row.querySelector('dt')?.textContent ?? '',
              value: row.querySelector('dd')?.textContent ?? '',
            })),
            navigationPresent: [...document.querySelectorAll('#section-nav a')]
              .some((link) => link.textContent.includes('Battery and Charging')),
            duplicateIdCount,
            hiddenFocusableCount: [...document.querySelectorAll('#sections button, #sections a, #sections input, #sections textarea, #sections select')]
              .filter((control) => control.closest('[hidden]'))
              .length,
            pageOverflow: document.documentElement.scrollWidth > window.innerWidth,
          };
        };

        await parse(batteryText);
        const full = snapshot();

        searchInput.value = 'Maximum Capacity';
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        await new Promise((resolve) => setTimeout(resolve, 220));
        await nextFrame();
        const visibleSearch = snapshot();

        searchInput.value = 'no such battery value';
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        await new Promise((resolve) => setTimeout(resolve, 220));
        await nextFrame();
        const noResult = snapshot();

        document.querySelector('#clear-search').click();
        await nextFrame();
        const searchCleared = snapshot();

        document.querySelector('#privacy-toggle').click();
        await nextFrame();
        const raw = snapshot();
        document.querySelector('#sections .report-document__mode-action').click();
        await nextFrame();
        const sanitizedAgain = snapshot();

        await parse(partialBatteryText);
        const partial = snapshot();
        await parse(createLargeCoreAnalyticsFixture());
        const absent = snapshot();
        await parse(batteryText);

        document.querySelector('#add-to-comparison').click();
        await nextFrame();
        document.querySelector('#add-to-comparison').click();
        await nextFrame();
        document.querySelector('#compare-reports').click();
        await nextFrame();
        const comparison = snapshot();
        document.querySelector('#clear-comparison').click();
        await nextFrame();
        document.querySelector('#clear-report').click();
        await nextFrame();
        const cleared = snapshot();

        return {
          full,
          visibleSearch,
          noResult,
          searchCleared,
          raw,
          sanitizedAgain,
          partial,
          absent,
          comparison,
          cleared,
          searchStatus: document.querySelector('#search-count').textContent,
        };
      }

      async function run() {
        await loadAppMarkup();
        await nextFrame();
        const coreText = createLargeCoreAnalyticsFixture();
        const stackshotText = createLargeStackshotFixture();
        const workflowText = await fetch('../examples/coreanalytics.ips.ca.synced').then((response) => response.text());
        const appWorkflow = await applicationWorkflow(workflowText);
        const responsive = await responsiveBrowserWorkflow();
        const batteryPresentation = await batteryPresentationWorkflow();
        const core = await benchmarkReport(coreText, 'SyntheticMetricGroup-000', 'coreanalytics');
        const stackshot = await benchmarkReport(stackshotText, 'SyntheticStackProcess', 'resource-stackshot');
        const repeated = await repeatedWorkflow(coreText, 'SyntheticMetricGroup-000');
        const exactMatchRendering = await exactMatchRenderingWorkflow();
        const modePresentationSafety = await modePresentationSafetyWorkflow();
        const visibleSearchContract = visibleSearchContractWorkflow();
        let serviceWorkerReady = false;
        if ('serviceWorker' in navigator) {
          try {
            await navigator.serviceWorker.register('../service-worker.js');
            await navigator.serviceWorker.ready;
            serviceWorkerReady = true;
          } catch (error) {
            errors.push(`service worker: ${error.message}`);
          }
        }

        resultsElement.textContent = JSON.stringify({
          browser: navigator.userAgent,
          viewport: { width: window.innerWidth, height: window.innerHeight },
          settleMode,
          workloads: {
            coreAnalytics: { bytes: new TextEncoder().encode(coreText).length, records: 5000 },
            stackshot: { bytes: new TextEncoder().encode(stackshotText).length, processes: 5000 },
          },
          core,
          stackshot,
          repeatedWorkflow: repeated,
          applicationWorkflow: appWorkflow,
          responsive,
          batteryPresentation,
          exactMatchRendering,
          modePresentationSafety,
          visibleSearchContract,
          reportDocumentSemantics: reportDocumentSemantics(),
          accessibility: accessibilityReport(),
          containment: containmentReport(),
          pwa: {
            serviceWorkerApiAvailable: serviceWorkerReady,
            offlineReload: 'not measured; network interception is unavailable',
            heapSnapshots: 'not measured; browser heap tooling is unavailable',
          },
          errors,
        }, null, 2);
        document.title = 'Browser performance baseline complete';
      }

      run().catch((error) => {
        resultsElement.textContent = JSON.stringify({ error: error.message, errors }, null, 2);
        document.title = 'Browser performance baseline failed';
      });
    </script>
  </body>
</html>
